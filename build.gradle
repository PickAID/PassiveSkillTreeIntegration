    implementation fg.deobf("curse.maven:framework-549225:7573740")
    implementation fg.deobf(passiveSkillTreeDependency)
    compileOnly fg.deobf(gunCoreDependency)
    runtimeOnly fg.deobf(gunCoreDependency)

    [
            "mrcrayfishs-gun-mod-unofficial-945471:7041829",
            "timeless-and-classics-zero-1028108:7745481",
            "vics-point-blank-961053:7664533",
            "vanilla-animated-guns-1357310:7056729",
            "scorched-guns-802940:7232063",
            "just-enough-guns-820727:6808139"
    ].each { coordinate ->
        compileOnly fg.deobf("curse.maven:${coordinate}")
    }
    // runtimeOnly fg.deobf("curse.maven:mrcrayfishs-gun-mod-unofficial-945471:7041829")
    // runtimeOnly fg.deobf("curse.maven:timeless-and-classics-zero-1028108:7745481")
    // runtimeOnly fg.deobf("curse.maven:vics-point-blank-961053:7664533")
    // runtimeOnly fg.deobf("curse.maven:vanilla-animated-guns-1357310:7056729")
    // runtimeOnly fg.deobf("curse.maven:scorched-guns-802940:7232063")
    // runtimeOnly fg.deobf("curse.maven:just-enough-guns-820727:6808139")

    def libraries = new File(file("libraries"), "${config.mc_version}")
    if (!libraries.isDirectory()) libraries.mkdirs()

    def libDir = new File(libraries, "all");
    if (libDir.isDirectory()) {
        libDir.eachFile { file ->
            def splitPos = file.name.lastIndexOf("-")
            def modartifact = file.name.substring(0, splitPos)
            def modversion = file.name.substring(splitPos + 1, file.name.length() - 4)
            dependencies {
                implementation fg.deobf(project.dependencies.create("_all:$modartifact:$modversion") {
                    transitive = false
                })
            }
        }
    } else libDir.mkdir();

    libDir = new File(libraries, "classpathOnly");
    if (libDir.isDirectory()) {
        libDir.eachFile { file ->
            def splitPos = file.name.lastIndexOf("-")
            def modartifact = file.name.substring(0, splitPos)
            def modversion = file.name.substring(splitPos + 1, file.name.length() - 4)
            dependencies {
                compileOnly fg.deobf(project.dependencies.create("_classpath:$modartifact:$modversion") {
                    transitive = false
                })
            }
        }
    } else libDir.mkdir();

    libDir = new File(libraries, "runtimeOnly");
    if (libDir.isDirectory()) {
        libDir.eachFile { file ->
            def splitPos = file.name.lastIndexOf("-")
            def modartifact = file.name.substring(0, splitPos)
            def modversion = file.name.substring(splitPos + 1, file.name.length() - 4)
            dependencies {
                runtimeOnly fg.deobf(project.dependencies.create("_runtime:$modartifact:$modversion") {
                    transitive = false
                })
            }
        }
    } else libDir.mkdir();

    libDir = new File(file("libraries"), "embedded");
    if (libDir.isDirectory()) {
        libDir.eachFile { file ->
            def splitPos = file.name.lastIndexOf("-")
            def modartifact = file.name.substring(0, splitPos)
            def modversion = file.name.substring(splitPos + 1, file.name.length() - 4)
            def modreference = "lib:$modartifact:$modversion"

            dependencies {
                implementation project.dependencies.create(modreference) {
                    transitive = false
                }
            }
        }
    } else libDir.mkdir();
}

