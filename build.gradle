dependencies {
    minecraft "net.minecraftforge:forge:${config.mc_version}-${config.forge_version}"
    testRuntimeOnly "com.google.code.gson:gson:2.11.0"
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.2"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.2"

    def addConfiguredDependency = { Map<String, Object> dependencySpec ->
        def dependency = project.dependencies.create(dependencySpec.notation as String) {
            transitive = dependencySpec.transitive
        }
        def resolvedDependency = dependencySpec.deobf ? fg.deobf(dependency) : dependency
        if (dependencySpec.configuration == "jarJar") {
            jarJar(group: dependencySpec.group, name: dependencySpec.artifact, version: dependencySpec.range) {
                transitive = dependencySpec.transitive
            }
        } else {
            add(dependencySpec.configuration as String, resolvedDependency)
        }
    }

    (project.ext.templateBuiltinDependencies + templateFeatureDependencies + templateDependencies + templateDevPackDependencies).each(addConfiguredDependency)

    if (enabledFeatures.mixin_extras) {
        jarJar(group: 'com.github.llamalad7.mixinextras', name: 'mixinextras-forge', version: "[${config.mixin_extras_version},)")
    }

    implementation fg.deobf(passiveSkillTreeDependency)
    compileOnly fg.deobf(gunCoreDependency)
    runtimeOnly fg.deobf(gunCoreDependency)
    if (passiveStJsJar.isFile()) {
        runtimeOnly fg.deobf("local.passivestjs:PassiveSTJS:1.20.1-0.2.0")
    }

    def libraries = new File(file("libraries"), "${config.mc_version}")
    if (!libraries.isDirectory()) libraries.mkdirs()

    def libDir = new File(libraries, "all");
    if (libDir.isDirectory()) {
        libDir.eachFile { file ->
            def splitPos = file.name.lastIndexOf("-")
            def modartifact = file.name.substring(0, splitPos)
            def modversion = file.name.substring(splitPos + 1, file.name.length() - 4)
            dependencies {
                implementation fg.deobf(project.dependencies.create("_all:$modartifact:$modversion") {
                    transitive = false
                })
            }
        }
    } else libDir.mkdir();

    libDir = new File(libraries, "classpathOnly");
    if (libDir.isDirectory()) {
        libDir.eachFile { file ->
            def splitPos = file.name.lastIndexOf("-")
            def modartifact = file.name.substring(0, splitPos)
            def modversion = file.name.substring(splitPos + 1, file.name.length() - 4)
            dependencies {
                compileOnly fg.deobf(project.dependencies.create("_classpath:$modartifact:$modversion") {
                    transitive = false
                })
            }
        }
    } else libDir.mkdir();

    libDir = new File(libraries, "runtimeOnly");
    if (libDir.isDirectory()) {
        libDir.eachFile { file ->
            def splitPos = file.name.lastIndexOf("-")
            def modartifact = file.name.substring(0, splitPos)
            def modversion = file.name.substring(splitPos + 1, file.name.length() - 4)
            dependencies {
                runtimeOnly fg.deobf(project.dependencies.create("_runtime:$modartifact:$modversion") {
                    transitive = false
                })
            }
        }
    } else libDir.mkdir();

    libDir = new File(file("libraries"), "embedded");
    if (libDir.isDirectory()) {
        libDir.eachFile { file ->
            def splitPos = file.name.lastIndexOf("-")
            def modartifact = file.name.substring(0, splitPos)
            def modversion = file.name.substring(splitPos + 1, file.name.length() - 4)
            def modreference = "lib:$modartifact:$modversion"

            dependencies {
                implementation project.dependencies.create(modreference) {
                    transitive = false
                }
            }
        }
    } else libDir.mkdir();
}

