buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url "https://plugins.gradle.org/m2/" }
        mavenCentral()
        maven {
            name = 'sponge'
            url = 'https://repo.spongepowered.org/maven'
        }
    }
    dependencies {
        classpath "gradle.plugin.com.matthewprenger:CurseGradle:1.4.+"
        classpath 'org.spongepowered:mixingradle:0.7.+'
    }
}


plugins {
    id "com.modrinth.minotaur" version "2.+"
    id 'net.neoforged.gradle' version '[6.0.13, 6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

apply plugin: 'idea'
apply plugin: 'maven-publish'
apply plugin: "com.matthewprenger.cursegradle"
apply plugin: 'org.spongepowered.mixin'

jarJar.enable()

ext.configFile = file("build.txt")
configFile.withReader {
    def prop = new Properties()
    prop.load(it)
    project.ext.config = new ConfigSlurper().parse(prop)
    project.ext.hasConfig = { key ->
        return config.isSet(key);
    }
}

version = config.mod_version
group = config.maven_group
base {
    archivesName = "${config.archive_name}-${config.mc_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

mixin {
    add sourceSets.main, "mixins.${config.mod_id}.refmap.json"
    config "mixins.${config.mod_id}.json"
}

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

def mainBootstrapClasspath = {
    def output = sourceSets.main.output
    def paths = new LinkedHashSet<String>()
    if (output.resourcesDir != null) {
        paths.add(output.resourcesDir.absolutePath)
    }
    return paths.join(File.pathSeparator)
}

def resolvePassiveSkillTreeJar() {
    def passiveSkillTreeJarName = "PassiveSkillTree-1.20.1-BETA-0.7.4-all.jar"
    def explicitJar = providers.gradleProperty("passiveSkillTreeJar").orNull ?: System.getenv("PASSIVE_SKILL_TREE_JAR")
    if (explicitJar) {
        def resolved = file(explicitJar)
        if (resolved.isFile()) {
            return resolved
        }
        throw new GradleException("Configured PassiveSkillTree jar does not exist: ${resolved}")
    }

    def candidates = [
            file(passiveSkillTreeJarName),
            file("libs/${passiveSkillTreeJarName}"),
            file("libraries/${config.mc_version}/all/${passiveSkillTreeJarName}"),
            file("../${passiveSkillTreeJarName}"),
            file("../libs/${passiveSkillTreeJarName}"),
            file("../libraries/${config.mc_version}/all/${passiveSkillTreeJarName}"),
            file("../PassiveSkillTree/build/libs/${passiveSkillTreeJarName}")
    ]

    def resolved = candidates.find { it.isFile() }
    if (resolved != null) {
        return resolved
    }

    return null
}

def passiveSkillTreeJar = resolvePassiveSkillTreeJar()
def passiveSkillTreeCurseFileId = "7897205"
def passiveSkillTreeJarVersion = passiveSkillTreeJar != null ? passiveSkillTreeJar.name.substring("PassiveSkillTree-".length(), passiveSkillTreeJar.name.length() - ".jar".length()) : null
def passiveSkillTreeDependency = passiveSkillTreeJar != null
        ? "local.passiveskilltree:PassiveSkillTree:${passiveSkillTreeJarVersion}"
        : "curse.maven:passive-skill-tree-850298:${passiveSkillTreeCurseFileId}"

if (passiveSkillTreeJar != null) {
    println("PassiveSkillTree jar: ${passiveSkillTreeJar.absolutePath}")
} else {
    println("PassiveSkillTree dependency: curse.maven:passive-skill-tree-850298:${passiveSkillTreeCurseFileId} (fallback, local ${"PassiveSkillTree-1.20.1-BETA-0.7.4-all.jar"} not found)")
}

if (passiveSkillTreeJar != null) {
    repositories {
        flatDir {
            dirs passiveSkillTreeJar.parentFile
        }
    }
}

def resolveGunCoreJar() {
    def gunCoreArtifact = "guncore-forge-${config.mc_version}"
    def explicitJar = providers.gradleProperty("gunCoreJar").orNull ?: System.getenv("GUN_CORE_JAR")
    if (explicitJar) {
        def resolved = file(explicitJar)
        if (resolved.isFile()) {
            return resolved
        }
        throw new GradleException("Configured GunCore jar does not exist: ${resolved}")
    }

    def candidateDirs = [
            file("libs"),
            file("../GunCore/build/libs"),
            file("../libs"),
            file("libraries/${config.mc_version}/all")
    ]

    def matches = candidateDirs.collectMany { dir ->
        if (!dir.isDirectory()) {
            return []
        }
        return (dir.listFiles()?.findAll { candidate ->
            candidate.isFile() &&
                    candidate.name.startsWith("${gunCoreArtifact}-") &&
                    candidate.name.endsWith(".jar") &&
                    !candidate.name.endsWith("-sources.jar")
        } ?: []).sort { left, right -> left.name <=> right.name }
    }
    if (matches.size() == 1) {
        return matches[0]
    }
    if (matches.size() > 1) {
        throw new GradleException("Multiple GunCore jars found: ${matches*.absolutePath.join(', ')}. Set -PgunCoreJar or GUN_CORE_JAR to choose one explicitly.")
    }

    throw new GradleException("Unable to resolve GunCore jar. Checked: ${candidateDirs*.absolutePath.join(', ')}")
}

def gunCoreJar = resolveGunCoreJar()
def gunCoreArtifact = "guncore-forge-${config.mc_version}"
def gunCoreVersion = gunCoreJar.name.substring("${gunCoreArtifact}-".length(), gunCoreJar.name.length() - ".jar".length())
def gunCoreDependency = "local.guncore:${gunCoreArtifact}:${gunCoreVersion}"

println("GunCore jar: ${gunCoreJar.absolutePath}")

repositories {
    flatDir {
        dirs gunCoreJar.parentFile
    }
}

minecraft {
    mappings channel: 'parchment', version: '2023.09.03-1.20.1'
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run/client')
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', config.mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            lazyToken 'minecraft_classpath', mainBootstrapClasspath
            def args = new ArrayList()

            if (hasConfig("mc_user") && !config.mc_user.isEmpty()) {
                def userId = config.mc_user.split(',', 2)
                args.add "--username"
                args.add userId[0]

                args.add "--uuid"
                if (userId.length > 1) args.add userId[1]
                else args.add "00000000000000000000000000000001" // this is a default
            }

            setArgs(args)
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run/server')
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', config.mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            lazyToken 'minecraft_classpath', mainBootstrapClasspath
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        gameTestServer {
            workingDirectory project.file('run/server')
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', config.mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            lazyToken 'minecraft_classpath', mainBootstrapClasspath
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run/data')
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', config.mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            lazyToken 'minecraft_classpath', mainBootstrapClasspath

            def args = new ArrayList()
            args.add "--mod"
            args.add config.mod_id
            args.add "--all"
            args.add "--output"
            args.add file('src/generated/resources/').absolutePath
            args.add "--existing"
            args.add file('src/main/resources/').absolutePath

            setArgs(args)

            mods {
                "${config.mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

