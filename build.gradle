def resolveGunCoreJar() {
    def gunCoreArtifact = "guncore-forge-${config.mc_version}"
    def explicitJar = providers.gradleProperty("gunCoreJar").orNull ?: System.getenv("GUN_CORE_JAR")
    if (explicitJar) {
        def resolved = file(explicitJar)
        if (resolved.isFile()) {
            return resolved
        }
        throw new GradleException("Configured GunCore jar does not exist: ${resolved}")
    }

    def candidateDirs = [
            file("libs"),
            file("../GunCore/build/libs"),
            file("../libs"),
            file("libraries/${config.mc_version}/all")
    ]

    def matches = candidateDirs.collectMany { dir ->
        if (!dir.isDirectory()) {
            return []
        }
        return (dir.listFiles()?.findAll { candidate ->
            candidate.isFile() &&
                    candidate.name.startsWith("${gunCoreArtifact}-") &&
                    candidate.name.endsWith(".jar") &&
                    !candidate.name.endsWith("-sources.jar")
        } ?: []).sort { left, right -> left.name <=> right.name }
    }
    if (matches.size() == 1) {
        return matches[0]
    }
    if (matches.size() > 1) {
        throw new GradleException("Multiple GunCore jars found: ${matches*.absolutePath.join(', ')}. Set -PgunCoreJar or GUN_CORE_JAR to choose one explicitly.")
    }

    throw new GradleException("Unable to resolve GunCore jar. Checked: ${candidateDirs*.absolutePath.join(', ')}")
}

def gunCoreJar = resolveGunCoreJar()
