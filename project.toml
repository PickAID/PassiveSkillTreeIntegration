[publish]
maven_url = ""
curseforge_project = 0
modrinth_project = ""
release_type = "alpha"

[publish.mods]
game_versions = ["1.20.1"]
loaders = ["forge"]

[publish.modrinth]
changelog_file = "CHANGELOG.md"
